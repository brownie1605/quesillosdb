{% extends 'layouts/base.html' %}

{% block page_title %}Usuarios y Permisos{% endblock %}

{% block content %}
<div class="page-header">
    <div class="filter-group">
        <div class="search-bar">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar usuario...">
        </div>
        <select id="rolFilter" class="form-control">
            <option value="">Todos los Roles</option>
        </select>
        <select id="estadoFilter" class="form-control">
            <option value="">Todos los Estados</option>
            <option value="activo">Activos</option>
            <option value="inactivo">Inactivos</option>
            <option value="bloqueado">Bloqueados</option>
        </select>
    </div>
    
    <button id="btnNuevoUsuario" class="btn btn-primary">+ Nuevo Usuario</button>
</div>

<div class="panel">
    <table id="tablaUsuarios">
        <thead>
            <tr>
                <th>Avatar</th>
                <th>Usuario</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Correo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Llenado por JS -->
        </tbody>
    </table>
</div>

<!-- Modal Usuario -->
<div id="modalUsuario" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style=" padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
        <h3 id="modalUsuarioTitle" style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">Nuevo Usuario</h3>
        
        <form id="formUsuario">
            <input type="hidden" id="usr_id">
            
            <div style="margin-bottom: 10px;">
                <label>Foto de Perfil</label>
                <input type="file" id="usr_imagen" class="form-control" accept="image/*" style="width: 100%;">
            </div>
            
            <div style="margin-bottom: 10px;">
                <label>Nombre Completo *</label>
                <input type="text" id="usr_nombre" class="form-control" style="width: 100%;" required>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div style="flex: 1;">
                    <label>Nombre de Usuario *</label>
                    <input type="text" id="usr_usuario" class="form-control" style="width: 100%;" required>
                </div>
                <div style="flex: 1;">
                    <label>Contraseña</label>
                    <input type="password" id="usr_password" class="form-control" style="width: 100%;" placeholder="Obligatorio al crear">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Correo</label>
                    <input type="email" id="usr_correo" class="form-control" style="width: 100%;">
                </div>
                <div style="flex: 1;">
                    <label>Teléfono</label>
                    <input type="text" id="usr_telefono" class="form-control" style="width: 100%;">
                </div>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Rol *</label>
                <select id="usr_rol" class="form-control" style="width: 100%;" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="button" id="btnCerrarModalUsuario" class="btn" style="flex: 1; background: #e0e0e0; color: #333;">Cancelar</button>
                <button type="submit" class="btn btn-success" style="flex: 1;">Guardar Usuario</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/usuarios.js') }}?v=3"></script>
{% endblock %}
