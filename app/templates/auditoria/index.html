{% extends 'layouts/base.html' %}

{% block page_title %}Auditoría del Sistema{% endblock %}

{% block content %}
<div class="page-header">
    <div class="filter-group">
        <div class="search-bar">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar acción o usuario...">
        </div>
        <select id="moduloFilter" class="form-control">
            <option value="">Todos los Módulos</option>
            <option value="Auth">Auth</option>
            <option value="Usuarios">Usuarios</option>
            <option value="Ventas">Ventas</option>
            <option value="Productos">Productos</option>
        </select>
    </div>
</div>

<div class="panel">
    <table id="tablaAuditoria">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Módulo</th>
                <th>Acción</th>
                <th>IP</th>
                <th>Detalles</th>
            </tr>
        </thead>
        <tbody>
            <!-- Llenado por JS -->
        </tbody>
    </table>
</div>

<!-- Modal Detalles -->
<div id="modalAuditoria" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style=" padding: 20px; border-radius: 8px; width: 500px; max-width: 90%;">
        <h3 style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">Detalles de la Acción</h3>
        <pre id="auditoriaDetallesContent" class="modal-section" style="padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 13px;"></pre>
        <div style="text-align: right; margin-top: 15px;">
            <button type="button" onclick="document.getElementById('modalAuditoria').style.display='none'" class="btn" style="background: #e0e0e0; color: #333;">Cerrar</button>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auditoria.js') }}"></script>
{% endblock %}
