{% extends 'layouts/base.html' %}

{% block title %}Clientes{% endblock %}
{% block page_title %}Clientes{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
    .titulo { color:#5d4037; font-weight:700; }
    .btn-cafe { background: linear-gradient(45deg,#8d6e63,#bcaaa4); color:#fff; border:none; }
    .btn-cafe:hover { color:#fff; opacity:.9; }
    table thead { background:#f5efe9; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="titulo">🙂 Clientes</h3>
    <button class="btn btn-cafe" data-bs-toggle="modal" data-bs-target="#modalCliente" onclick="abrirNuevo()">
        <i class="bi bi-plus-circle"></i> Nuevo cliente
    </button>
</div>

<input type="text" class="form-control mb-3" id="buscar" placeholder="Buscar por nombre o cédula...">

<div class="table-responsive">
    <table class="table table-hover align-middle bg-white">
        <thead><tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th><th>Dirección</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" class="text-center py-4">Cargando…</td></tr></tbody>
    </table>
</div>

<div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="modalTitulo">Nuevo cliente</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="hidden" id="c_id">
                <div class="mb-2"><label class="form-label">Nombre *</label><input class="form-control" id="c_nombre" required></div>
                <div class="mb-2"><label class="form-label">Cédula</label><input class="form-control" id="c_cedula"></div>
                <div class="mb-2"><label class="form-label">Teléfono</label><input class="form-control" id="c_telefono"></div>
                <div class="mb-2"><label class="form-label">Dirección</label><textarea class="form-control" id="c_direccion" rows="2"></textarea></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-cafe" id="btnGuardar" onclick="guardar()">Guardar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let clientes = [];
let modal;

async function cargar() {
    clientes = await fetch('/clientes/api/list').then(r => r.json());
    render();
}

function render() {
    const texto = document.getElementById('buscar').value.toLowerCase();
    const lista = clientes.filter(c => !texto || c.nombre.toLowerCase().includes(texto) || (c.cedula||'').includes(texto));
    const tbody = document.getElementById('tbody');
    if (!lista.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Sin clientes registrados.</td></tr>'; return; }
    tbody.innerHTML = lista.map(c => `
        <tr>
            <td>${c.nombre}</td>
            <td>${c.cedula||'-'}</td>
            <td>${c.telefono||'-'}</td>
            <td>${c.direccion||'-'}</td>
            <td><span class="badge ${c.estado==='activo'?'bg-success':'bg-secondary'}">${c.estado}</span></td>
            <td>
                <button class="btn btn-sm btn-outline-secondary" onclick='abrirEditar(${JSON.stringify(c)})'><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${c.id_cliente})"><i class="bi bi-trash"></i></button>
            </td>
        </tr>`).join('');
}

document.getElementById('buscar').addEventListener('input', render);

function abrirNuevo() {
    document.getElementById('modalTitulo').textContent = 'Nuevo cliente';
    ['c_id','c_nombre','c_cedula','c_telefono','c_direccion'].forEach(id => document.getElementById(id).value = '');
}

function abrirEditar(c) {
    document.getElementById('modalTitulo').textContent = 'Editar cliente';
    document.getElementById('c_id').value = c.id_cliente;
    document.getElementById('c_nombre').value = c.nombre || '';
    document.getElementById('c_cedula').value = c.cedula || '';
    document.getElementById('c_telefono').value = c.telefono || '';
    document.getElementById('c_direccion').value = c.direccion || '';
    modal = modal || new bootstrap.Modal(document.getElementById('modalCliente'));
    modal.show();
}

async function guardar() {
    const id = document.getElementById('c_id').value;
    const datos = {
        nombre: document.getElementById('c_nombre').value.trim(),
        cedula: document.getElementById('c_cedula').value,
        telefono: document.getElementById('c_telefono').value,
        direccion: document.getElementById('c_direccion').value,
    };
    if (!datos.nombre) { showCustomAlert('El nombre es obligatorio'); return; }
    const url = id ? `/clientes/api/editar/${id}` : '/clientes/api/crear';
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(datos)}).then(r=>r.json());
    if (r.success) {
        bootstrap.Modal.getInstance(document.getElementById('modalCliente')).hide();
        cargar();
    } else showCustomAlert(r.message);
}

async function eliminar(id) {
    showCustomConfirm('¿Desactivar este cliente?', async () => {
        const r = await fetch(`/clientes/api/eliminar/${id}`, {method:'POST'}).then(r=>r.json());
        if (r.success) cargar(); else showCustomAlert(r.message);
    });
}

cargar();
</script>
{% endblock %}
