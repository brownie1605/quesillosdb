{% extends 'layouts/base.html' %}

{% block page_title %}Inventario{% endblock %}

{% block content %}
<div class="cards-grid" style="grid-template-columns: 1fr; margin-bottom: 20px;">
    <div class="kpi-card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <div>
            <p style="margin: 0;">Inventario Total (Unidades)</p>
            <h2 id="kpiTotalInventario" style="margin: 0;">0</h2>
        </div>
        <div style="font-size: 30px;">📦</div>
    </div>
</div>

<div class="page-header">
    <div class="filter-group">
        <div class="search-bar">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar producto (nombre, código)...">
        </div>
        <select id="stockFilter" class="form-control">
            <option value="">Todos los productos</option>
            <option value="normal">Normal</option>
            <option value="low">Stock Bajo</option>
            <option value="out">Sin Stock</option>
        </select>
    </div>
    
    <button id="btnExportarExcel" class="btn btn-success">⬇️ Exportar Excel</button>
</div>

<div class="panel">
    <table id="tablaInventario">
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Stock Actual</th>
                <th>Stock Mínimo</th>
                <th>Estado Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Llenado por JS -->
        </tbody>
    </table>
</div>

<!-- Modal Ajuste Stock -->
<div id="modalStock" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="modal-content" style=" padding: 20px; border-radius: 8px; width: 350px; max-width: 90%;">
        <h3 id="modalStockTitle" style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px;">Entrada de Producto / Ajuste</h3>
        
        <form id="formStock">
            <input type="hidden" id="inv_producto_id">
            
            <div style="margin-bottom: 15px;">
                <label>Producto</label>
                <input type="text" id="inv_nombre_producto" class="form-control" style="width: 100%; background: #f5f5f5;" readonly>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Stock Actual</label>
                    <input type="number" id="inv_stock_actual" class="form-control" style="width: 100%;" step="0.01" required>
                </div>
                <div style="flex: 1;">
                    <label>Stock Mínimo</label>
                    <input type="number" id="inv_stock_minimo" class="form-control" style="width: 100%;" step="0.01" required>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button type="button" id="btnCerrarModalStock" class="btn" style="flex: 1; background: #e0e0e0; color: #333;">Cancelar</button>
                <button type="submit" class="btn btn-primary" style="flex: 1;">Guardar</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="{{ url_for('static', filename='js/inventario.js') }}?v=3"></script>
{% endblock %}
