{% extends 'layouts/base.html' %}

{% block page_title %}Inventario{% endblock %}

{% block content %}
<div class="cards-grid" style="grid-template-columns: 1fr; margin-bottom: 20px;">
    <div class="kpi-card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
        <div>
            <p style="margin: 0;">Inventario Total (Unidades)</p>
            <h2 id="kpiTotalInventario" style="margin: 0;">0</h2>
        </div>
        <div style="font-size: 30px;">📦</div>
    </div>
</div>

<div class="page-header">
    <div class="filter-group">
        <div class="search-bar">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar producto (nombre, código)...">
        </div>
        <select id="stockFilter" class="form-control">
            <option value="">Todos los productos</option>
            <option value="normal">Normal</option>
            <option value="low">Stock Bajo</option>
            <option value="out">Sin Stock</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px;">
        <a href="{{ url_for('inventario.movimientos') }}" class="btn btn-secondary">🧾 Historial de movimientos</a>
        <button id="btnExportarExcel" class="btn btn-success">⬇️ Exportar Excel</button>
    </div>
</div>

<!-- Pestañas por grupo de inventario -->
<div id="tabsGrupoInventario" style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;">
    <button type="button" class="btn-tab-inventario activo" data-grupo="">Todos</button>
    <button type="button" class="btn-tab-inventario" data-grupo="POS">🍽️ POS (menú)</button>
    <button type="button" class="btn-tab-inventario" data-grupo="Limpieza">🧼 Limpieza</button>
    <button type="button" class="btn-tab-inventario" data-grupo="Lácteos">🥛 Lácteos</button>
    <button type="button" class="btn-tab-inventario" data-grupo="Varios">📦 Varios</button>
</div>

<style>
    .btn-tab-inventario {
        padding: 8px 16px;
        border-radius: 20px;
        border: 1.5px solid #e0d5cc;
        background: #fff;
        color: #5d4037;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        transition: .15s;
    }
    .btn-tab-inventario:hover { background: #fbf3ef; }
    .btn-tab-inventario.activo { background: #8d6e63; border-color: #8d6e63; color: #fff; }
</style>

<div class="panel">
    <table id="tablaInventario">
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Stock Actual</th>
                <th>Stock Mínimo</th>
                <th>Estado Stock</th>
            </tr>
        </thead>
        <tbody>
            <!-- Llenado por JS -->
        </tbody>
    </table>
    <div id="paginacionInventario" class="pagination"></div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="{{ url_for('static', filename='js/inventario.js') }}?v=3"></script>
{% endblock %}
