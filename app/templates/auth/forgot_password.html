{% extends 'auth/_recovery_base.html' %}
{% set paso = 1 %}
{% block title %}Recuperar contraseña{% endblock %}

{% block contenido %}
<h2>Recuperar contraseña</h2>
<p class="ayuda">Ingresa el correo con el que fuiste registrado y selecciona tu rol.
   Te enviaremos un código de 6 dígitos.</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required autofocus placeholder="tucorreo@ejemplo.com">

    <label for="rol">Rol</label>
    <select id="rol" name="rol" required>
        <option value="">— Selecciona tu rol —</option>
        {% for r in roles %}
        <option value="{{ r.nombre }}">{{ r.nombre }}</option>
        {% endfor %}
    </select>

    <button type="submit">Enviar código</button>
</form>
{% endblock %}
