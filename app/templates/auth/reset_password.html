{% extends 'auth/_recovery_base.html' %}
{% set paso = 3 %}
{% block title %}Nueva contraseña{% endblock %}

{% block contenido %}
<h2>Nuevo PIN</h2>
<p class="ayuda">Elige un PIN de 4 a 6 números para <strong>{{ email }}</strong>.</p>

<form method="POST" onsubmit="return validar()">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">Nueva contraseña</label>
    <input type="password" id="password" name="password" required autofocus inputmode="numeric" minlength="4" maxlength="6" pattern="[0-9]{4,6}" title="Solo números, de 4 a 6 dígitos">

    <label for="password_confirm">Confirmar contraseña</label>
    <input type="password" id="password_confirm" name="password_confirm" required inputmode="numeric" minlength="4" maxlength="6" pattern="[0-9]{4,6}" title="Solo números, de 4 a 6 dígitos">

    <div id="aviso" class="alerta danger" style="display:none"></div>

    <button type="submit">Guardar contraseña</button>
</form>

<script>
function validar() {
    const a = document.getElementById('password').value;
    const b = document.getElementById('password_confirm').value;
    const aviso = document.getElementById('aviso');
    if (!/^[0-9]{4,6}$/.test(a)) {
        aviso.textContent = 'El PIN debe ser solo números, de 4 a 6 dígitos.';
        aviso.style.display = 'block';
        return false;
    }
    if (a !== b) {
        aviso.textContent = 'Las contraseñas no coinciden.';
        aviso.style.display = 'block';
        return false;
    }
    return true;
}
</script>
{% endblock %}
