{% extends 'auth/_recovery_base.html' %}
{% set paso = 3 %}
{% block title %}Nueva contraseña{% endblock %}

{% block contenido %}
<h2>Nueva contraseña</h2>
<p class="ayuda">Elige una contraseña de al menos 6 caracteres para <strong>{{ email }}</strong>.</p>

<form method="POST" onsubmit="return validar()">
    <label for="password">Nueva contraseña</label>
    <input type="password" id="password" name="password" required autofocus minlength="6">

    <label for="password_confirm">Confirmar contraseña</label>
    <input type="password" id="password_confirm" name="password_confirm" required minlength="6">

    <div id="aviso" class="alerta danger" style="display:none"></div>

    <button type="submit">Guardar contraseña</button>
</form>

<script>
function validar() {
    const a = document.getElementById('password').value;
    const b = document.getElementById('password_confirm').value;
    const aviso = document.getElementById('aviso');
    if (a.length < 6) {
        aviso.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        aviso.style.display = 'block';
        return false;
    }
    if (a !== b) {
        aviso.textContent = 'Las contraseñas no coinciden.';
        aviso.style.display = 'block';
        return false;
    }
    return true;
}
</script>
{% endblock %}
